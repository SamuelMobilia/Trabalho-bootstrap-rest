<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEPISEG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="catalogo.css">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="js/dados.js"></script>
  <script src="js/gepiseg-api.js"></script>
</head>
<body>
  <nav class="design-nav navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html"><img src="img/Logo GEPISEG Texto.png" alt="Logo GEPISEG"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="catalogo.html">Catálogo</a>
        </li>
      </ul>
      <form id="formBusca" class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Pesquisar artigos" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Pesquisar</button>
      </form>
    </div>
  </div>
</nav>

<main class="design-main">
  <section class="design-hero hero-compacto">
    <div class="container text-center">
      <h1 class="display-5 fw-bold">Catálogo de artigos</h1>
      <p class="lead mb-0">Toda a produção científica do GEPISEG em um só lugar.</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <p id="contagem" class="text-secondary mb-0"></p>
        <div class="dropdown">
          <button id="btnItens" class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Exibir: 8
          </button>
          <ul id="menuItens" class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item active" href="#" data-itens="8">8</a></li>
            <li><a class="dropdown-item" href="#" data-itens="16">16</a></li>
            <li><a class="dropdown-item" href="#" data-itens="24">24</a></li>
          </ul>
        </div>
      </div>

      <div id="gradeArtigos" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>

      <nav aria-label="Paginação de artigos" class="mt-5">
        <ul id="paginacao" class="pagination justify-content-center mb-0"></ul>
      </nav>
    </div>
  </section>
</main>

<div class="offcanvas offcanvas-top offcanvas-full" tabindex="-1" id="offcanvasArtigo" aria-labelledby="offcanvasArtigoLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasArtigoLabel">Detalhes do artigo</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body" id="conteudoOffcanvas">
    
  </div>
</div>

<footer class="rodape text-center">
  <div class="container">GEPISEG &copy; 2026 - Grupo de Pesquisa Interdisciplinar em Segurança Web</div>
</footer>

<script>

  const api = GepisegAPI.criar();
  const formBusca = document.querySelector('#formBusca');
  let paginaAtual = 1
  let itensPorPagina = 8
  let termoBusca = ""

  formBusca.addEventListener('submit', event => {
    event.preventDefault();
    termoBusca = formBusca.querySelector('input').value.trim()
    paginaAtual = 1
    mostrarTodosArtigos();
  });

  const paginacao = document.querySelector('#paginacao')
  const contagem = document.querySelector('#contagem')
  const btnItens = document.querySelector('#btnItens')
  const menuItens = document.querySelector('#menuItens')

  menuItens.addEventListener('click', event => {
    event.preventDefault();
    const item = event.target.closest('[data-itens]')
    if (!item) return

    itensPorPagina = Number(item.dataset.itens)
    paginaAtual = 1
    btnItens.textContent = `Exibir: ${itensPorPagina}`
    menuItens.querySelectorAll('.dropdown-item').forEach(i => i.classList.toggle('active', i === item))
    mostrarTodosArtigos();
  });

  paginacao.addEventListener('click', event => {
    event.preventDefault();
    const link = event.target.closest('[data-pagina]')
    if (!link || link.parentElement.classList.contains('disabled')) return

    paginaAtual = Number(link.dataset.pagina)
    mostrarTodosArtigos();
  });

  function desenharPaginacao(totalPaginas) {
    if (totalPaginas <= 1) {
      paginacao.innerHTML = ''
      return
    }

    const primeira = paginaAtual === 1
    const ultima = paginaAtual === totalPaginas

    let html = `
      <li class="page-item ${primeira ? 'disabled' : ''}">
        <a class="page-link" href="#" data-pagina="${paginaAtual - 1}" ${primeira ? 'aria-disabled="true" tabindex="-1"' : ''}>Anterior</a>
      </li>
    `

    for (let i = 1; i <= totalPaginas; i++) {
      const atual = i === paginaAtual
      html += `
      <li class="page-item ${atual ? 'active' : ''}">
        <a class="page-link" href="#" data-pagina="${i}" ${atual ? 'aria-current="page"' : ''}>${i}</a>
      </li>
      `
    }

    html += `
      <li class="page-item ${ultima ? 'disabled' : ''}">
        <a class="page-link" href="#" data-pagina="${paginaAtual + 1}" ${ultima ? 'aria-disabled="true" tabindex="-1"' : ''}>Próximo</a>
      </li>
    `

    paginacao.innerHTML = html
  }

  async function mostrarTodosArtigos() {
    const lista = document.querySelector("#gradeArtigos")

    try {
      const r = await api.artigos.listar({q: termoBusca, ordenar: "citacoes", porPagina: itensPorPagina, pagina: paginaAtual})
      let html = '';

      r.results.forEach(artigo => {
        const nomes = artigo.autores.map(function (a) { return a.nome; }).join(', ');
        html += `
        <div class="col">
          <div data-bs-toggle="offcanvas" data-bs-target="#offcanvasArtigo" aria-controls="offcanvasArtigo" onclick="mostrarDetalhe(${artigo.id})" class="card card-artigo h-100">
            <img src="${artigo.imagem}" class="card-img-top" alt="${artigo.titulo}" loading="lazy">
            <div class="card-body">
              <p class="tema mb-2">${artigo.tema}</p>
              <h5 class="card-title">${artigo.titulo}</h5>
              <p class="card-text text-secondary autores">${nomes}</p>
              <p class="card-text text-secondary meta">${artigo.ano} &middot; ${artigo.citacoes} citações</p>
            </div>
          </div>
        </div>
        `
      });

      lista.innerHTML = html;
      desenharPaginacao(r.info.pages)

      const primeiro = (paginaAtual - 1) * itensPorPagina + 1
      const ultimo = Math.min(paginaAtual * itensPorPagina, r.info.count)
      contagem.textContent = `Mostrando ${primeiro}–${ultimo} de ${r.info.count} artigos`

    } catch (erro) {
      lista.innerHTML = '<p class="w-100 text-center text-secondary py-5">Nenhum artigo encontrado.</p>';
      paginacao.innerHTML = ''
      contagem.textContent = ''
    }

  }

  async function mostrarDetalhe(id) {
      const caixa = document.getElementById('conteudoOffcanvas')

      try {
        const artigo = await api.artigos.porId(id);
        const pessoas = await api.seguir(artigo.pesquisadores);
        
        const autoresHtml = pessoas.map(p => {return '<p><img src="' + p.imagem + '" alt="' + p.nome + '" class="avatar"' +
        ' onerror="this.outerHTML = \'<span class=&quot;avatar&quot; style=&quot;background:' +
        p.cor + '&quot;>' + p.iniciais + '</span>\'"> <strong>' + p.nome + '</strong> — ' + p.titulacao + ' — ' + p.metricas.totalArtigos + ' artigos' + '</p>';}).join('');

        caixa.innerHTML = `
        <h2>${artigo.titulo}</h2>
        <p><strong>Veículo:</strong> ${artigo.veiculo}</p>
        <p><strong>Data de lançamento:</strong> ${artigo.dataLancamento}</p>
        <p><strong>Autores:</strong></p>
        ${autoresHtml}
        <hr>
        <pre>${artigo.conteudo}</pre>
        `;

        const offcanvas = bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('offcanvasArtigo'));

        offcanvas.show();
      } catch (erro) {
        caixa.innerHTML = 'Não foi possível carregar o artigo.'
      }

    }

  mostrarTodosArtigos();
</script>

</body>
</html>
