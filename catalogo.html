  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

<body>
  <nav class="design-nav navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html"><img src="img/Logo GEPISEG Texto.png" alt="Logo GEPISEG"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="catalogo.html">Catálogo</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Pesquisar artigos" aria-label="Search"/>
        <button class="btn btn-outline-success" onclick="" type="submit">Pesquisar</button>
      </form>
    </div>
  </div>
</nav>

<main>
<div class="listaArtigos">
  <div class="row">

  </div>
</div>
</main>

<footer class="rodape text-center">
  <div class="container">GEPISEG &copy; 2026 - Grupo de Pesquisa Interdisciplinar em Segurança Web</div>
</footer>

<script>

  const api = GepisegAPI.criar();

  async function mostrarTodosArtigos() {
    const lista = document.querySelector(".row")

    try {
      const r = await api.artigos.listar({ porPagina: 12})
      let html = '';

      r.results.forEach(artigo => {
        const nomes = artigo.autores.map(function (a) { return a.nome; }).join(', ');
        html += `
        <div class="col">
        <div class="card" style="width: 18rem;">
        <img src="${artigo.imagem}" class="card-img-top" alt="${artigo.nome}">
          <div class="card-body">
            <h5 class="card-title"><strong>${artigo.titulo}</strong></h5>
            <p class="card-text">${nomes}</p>
            <p class="card-text2">${artigo.ano} · ${artigo.citacoes} citações</p>
          </div>
        </div>
        </div>
        `
      });

      lista.innerHTML = html;

    } catch (erro) {
      lista.innerHTML = "Nenhum artigo encontrado.";
    }

  }

  mostrarTodosArtigos();
</script>

</body>
</html>
